[project]
name = "coolpilot"
version = "1.0.0"
description = "CoolPilot: local web control panel for laptop power, fans and stability"
requires-python = ">=3.9"
dependencies = ["flask>=3.0", "waitress>=3.0"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
